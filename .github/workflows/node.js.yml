name: UniVerse CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: universe-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universe-client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        continue-on-error: true
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: universe-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: universe-server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check index.js
